name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write   # Allows GitHub to request temporary AWS credentials via OIDC
  contents: read    # Allows GitHub to check out your repository code
  pull-requests: write # Allows GitHub to comment plan results on PRs

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest

    steps:
      # Step A: Download your repository code onto the runner machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Log into AWS using the IAM Role we created
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1  # Change to your AWS region if not using us-east-1

      # Step C: Install Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # Step D: Connect to your remote S3 backend
      - name: Terraform Init
        id: init
        run: terraform init

      # Step E: Check code syntax
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # Step F: Run a preview (Plan) only on Pull Requests
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # Step G: Run the actual deployment (Apply) only when code merges to main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false